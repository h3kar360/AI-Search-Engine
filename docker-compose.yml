services:
    postgres-db:
        container_name: postgres_ai_search_container
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_USER: h3kar360
            POSTGRES_PASSWORD: password
            POSTGRES_DB: ai_search_db
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - postgres-db:/var/lib/postgresql/data/pgdata
        ports:
            - "5324:5432"
        networks:
            - ai-search-network
        restart: unless-stopped

    redis:
        container_name: redis_ai_search_container
        image: redis:7.2-alpine
        ports:
            - "6380:6379"
        volumes:
            - redis-data:/data
        networks:
            - ai-search-network
        restart: unless-stopped
        command: redis-server --appendonly yes

    app:
        build: ./server
        ports:
            - 8000:8000
        env_file:
            - /server/.env
        networks:
            - ai-search-network
        depends_on:
            - postgres-db
            - redis

networks:
    ai-search-network:
        driver: bridge

volumes:
    postgres-db:
    redis-data:
