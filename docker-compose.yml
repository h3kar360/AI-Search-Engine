services:
  postgres-db:
    container_name: postgres_ai_search_container
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: h3kar360
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_search_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-db:/var/lib/postgresql/data/pgdata
    ports:
      - "5324:5432"
    networks:
      - postgres-db
    restart: unless-stopped

networks:
  postgres-db:
    driver: bridge

volumes:
  postgres-db:
